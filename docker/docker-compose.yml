services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ariescan-backend
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=sqlite:///./data/ariescan.db
      - ALLOW_PRIVATE_TARGETS=true
    volumes:
      - ariescan-data:/app/data
    networks:
      - ariescan
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ariescan-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ariescan

networks:
  ariescan:
    driver: bridge

volumes:
  ariescan-data:
